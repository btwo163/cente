[package]
name = "cente"
version = "0.1.1"
description = "Cente - Python 椤圭洰甯搁┗鎵樼洏涓庡悗鍙扮鐞嗗櫒"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "cente_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[build-dependencies]
tauri-build = { version = "2.7.3" }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.12.4", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
rfd = "0.15"
open = "5.3"
chrono = "0.4"
encoding_rs = "0.8"
semver = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.56"
