name: Publish Windows release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src-tauri/Cargo.toml'
      - '.github/workflows/release.yml'
permissions:
  contents: read
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify version and build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $metadata = cargo metadata --no-deps --format-version 1 --manifest-path src-tauri/Cargo.toml | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'cargo metadata failed' }
          if ($metadata.packages[0].version -ne $config.version) { throw 'Cargo and Tauri versions must match' }
          if ($config.version -notmatch '^\d+\.\d+\.\d+$') { throw 'A stable semantic version is required' }
          "RELEASE_TAG=v$($config.version)" >> $env:GITHUB_ENV
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib -- --skip startup_entry_round_trip_in_isolated_key
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          cargo build --release --locked --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          Copy-Item src-tauri/target/release/cente.exe cente-windows-x86_64.exe
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:RELEASE_TAG cente-windows-x86_64.exe --target $env:GITHUB_SHA --title "Cente $env:RELEASE_TAG" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed; existing versions are not overwritten' }
