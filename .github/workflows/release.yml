name: Publish Windows release
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'src-tauri/Cargo.toml'
      - '.github/workflows/release.yml'
permissions:
  contents: read
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Verify version and build
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $config = Get-Content src-tauri/tauri.conf.json -Raw | ConvertFrom-Json
          $metadata = cargo metadata --no-deps --format-version 1 --manifest-path src-tauri/Cargo.toml | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) { throw 'cargo metadata failed' }
          if ($metadata.packages[0].version -ne $config.version) { throw 'Cargo and Tauri versions must match' }
          if ($config.version -notmatch '^\d+\.\d+\.\d+$') { throw 'A stable semantic version is required' }
          $releaseTag = "v$($config.version)"
          "RELEASE_TAG=$releaseTag" >> $env:GITHUB_ENV
          cargo test --locked --manifest-path src-tauri/Cargo.toml --lib -- --skip startup_entry_round_trip_in_isolated_key
          if ($LASTEXITCODE -ne 0) { throw 'Tests failed' }
          powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File scripts/test-update-check.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Update check tests failed' }
          cargo build --release --locked --manifest-path src-tauri/Cargo.toml
          if ($LASTEXITCODE -ne 0) { throw 'Build failed' }
          Copy-Item src-tauri/target/release/cente.exe cente-windows-x86_64.exe
          $asset = Get-Item cente-windows-x86_64.exe
          @{
            version = $releaseTag
            notes = "Cente $releaseTag - https://github.com/$env:GITHUB_REPOSITORY/releases/tag/$releaseTag"
            url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$releaseTag/cente-windows-x86_64.exe"
            digest = 'sha256:' + (Get-FileHash $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            size = $asset.Length
            draft = $false
            prerelease = $false
          } | ConvertTo-Json | Set-Content cente-update.json -Encoding utf8
      - name: Publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $manifest = Get-Content cente-update.json -Raw | ConvertFrom-Json
          $asset = Get-Item cente-windows-x86_64.exe
          if ($manifest.version -ne $env:RELEASE_TAG -or $manifest.version -notmatch '^v\d+\.\d+\.\d+$') { throw 'Update manifest version mismatch' }
          if ($manifest.url -ne "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:RELEASE_TAG/cente-windows-x86_64.exe") { throw 'Update manifest URL mismatch' }
          if ($manifest.size -ne $asset.Length -or $manifest.digest -ne ('sha256:' + (Get-FileHash $asset.FullName -Algorithm SHA256).Hash.ToLowerInvariant())) { throw 'Update manifest integrity mismatch' }
          if ($asset.VersionInfo.ProductVersion -ne $manifest.version.Substring(1)) { throw 'Update binary version mismatch' }
          gh release create $env:RELEASE_TAG cente-windows-x86_64.exe cente-update.json --target $env:GITHUB_SHA --title "Cente $env:RELEASE_TAG" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed; existing versions are not overwritten' }
